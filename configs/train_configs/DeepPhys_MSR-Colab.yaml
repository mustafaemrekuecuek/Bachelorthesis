BASE: ['']

TOOLBOX_MODE: "train_and_test"

TRAIN:
  BATCH_SIZE: 4
  EPOCHS: 30
  LR: 1e-3
  MODEL_FILE_NAME: UBFC_DeepPhys_MSR_AppearanceOnly
  PLOT_LOSSES_AND_LR: True

  DATA:
    FS: 30
    DATASET: UBFC-rPPG
    DO_PREPROCESS: True
    DATA_FORMAT: NDCHW

    DATA_PATH: "/content/drive/MyDrive/UBFC-rPPG"
    CACHED_PATH: "/content/drive/MyDrive/cache/ubfc_msr_app_only"
    FILE_LIST_PATH: "/content/drive/MyDrive/data/file_lists/ubfc_msr_app_only"

    BEGIN: 0.0
    END: 0.7

    PREPROCESS:
      USE_MSR: True
      MSR:
        SCALES: [15, 80, 250]
        GAIN: 1.0
        OFFSET: 0.0
      DATA_TYPE: ['DiffNormalized', 'Standardized']
      DATA_AUG: ['None']
      LABEL_TYPE: DiffNormalized

      DO_CHUNK: True
      CHUNK_LENGTH: 300

      CROP_FACE:
        DO_CROP_FACE: True
        BACKEND: 'HC'
        USE_LARGE_FACE_BOX: True
        LARGE_BOX_COEF: 1.5

        DETECTION:
          DO_DYNAMIC_DETECTION: False
          DYNAMIC_DETECTION_FREQUENCY: 30
          USE_MEDIAN_FACE_BOX: False

      RESIZE:
        H: 36
        W: 36

VALID:
  DATA:
    FS: 30
    DATASET: UBFC-rPPG
    DO_PREPROCESS: True
    DATA_FORMAT: NDCHW

    DATA_PATH: "/content/drive/MyDrive/UBFC-rPPG"
    CACHED_PATH: "/content/drive/MyDrive/cache/ubfc_msr_app_only"
    FILE_LIST_PATH: "/content/drive/MyDrive/data/file_lists/ubfc_msr_app_only"

    BEGIN: 0.7
    END: 0.85

    PREPROCESS:
      USE_MSR: True
      MSR:
        SCALES: [15, 80, 250]
        GAIN: 1.0
        OFFSET: 0.0
      DATA_TYPE: ['DiffNormalized', 'Standardized']
      DATA_AUG: ['None']
      LABEL_TYPE: DiffNormalized

      DO_CHUNK: True
      CHUNK_LENGTH: 300

      CROP_FACE:
        DO_CROP_FACE: True
        BACKEND: 'HC'
        USE_LARGE_FACE_BOX: True
        LARGE_BOX_COEF: 1.5

        DETECTION:
          DO_DYNAMIC_DETECTION: False
          DYNAMIC_DETECTION_FREQUENCY: 30
          USE_MEDIAN_FACE_BOX: False

      RESIZE:
        H: 36
        W: 36

TEST:
  METRICS: ['MAE', 'RMSE', 'MAPE', 'Pearson', 'SNR', 'BA']
  USE_LAST_EPOCH: False

  DATA:
    FS: 30
    DATASET: UBFC-rPPG
    DO_PREPROCESS: True
    DATA_FORMAT: NDCHW

    DATA_PATH: "/content/drive/MyDrive/UBFC-rPPG"
    CACHED_PATH: "/content/drive/MyDrive/cache/ubfc_msr_app_only"
    FILE_LIST_PATH: "/content/drive/MyDrive/data/file_lists/ubfc_msr_app_only"

    BEGIN: 0.85
    END: 1.0

    PREPROCESS:
      USE_MSR: True
      MSR:
        SCALES: [15, 80, 250]
        GAIN: 1.0
        OFFSET: 0.0
      DATA_TYPE: ['DiffNormalized', 'Standardized']
      LABEL_TYPE: DiffNormalized

      DO_CHUNK: True
      CHUNK_LENGTH: 300

      CROP_FACE:
        DO_CROP_FACE: True
        BACKEND: 'HC'
        USE_LARGE_FACE_BOX: True
        LARGE_BOX_COEF: 1.5

        DETECTION:
          DO_DYNAMIC_DETECTION: False
          DYNAMIC_DETECTION_FREQUENCY: 30
          USE_MEDIAN_FACE_BOX: False

      RESIZE:
        H: 36
        W: 36

DEVICE: cuda:0
NUM_OF_GPU_TRAIN: 1

LOG:
  PATH: runs/exp

MODEL:
  DROP_RATE: 0.2
  NAME: DeepPhys
  TDCM:
    ENABLE: False
    CHANNELS: 128
    DROPOUT: 0.1
    KERNEL_SHORT: 3
    KERNEL_MID: 5
    KERNEL_LONG: 7
    DILATION_MID: 2
    DILATION_LONG: 3

INFERENCE:
  BATCH_SIZE: 4
  EVALUATION_METHOD: "FFT"

  EVALUATION_WINDOW:
    USE_SMALLER_WINDOW: False
    WINDOW_SIZE: 30

  MODEL_PATH: ""